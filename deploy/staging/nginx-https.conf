server {
    listen 80;
    server_name test.nexahub.airsales.ub.mn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/nexahub-test-acme;
        try_files $uri =404;
    }
    location / { return 301 https://test.nexahub.airsales.ub.mn$request_uri; }
}
server {
    listen 443 ssl;
    server_name test.nexahub.airsales.ub.mn;
    ssl_certificate /etc/letsencrypt/live/test.nexahub.airsales.ub.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.nexahub.airsales.ub.mn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location ~ (^|/)\. { return 404; }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location / {
        proxy_pass http://127.0.0.1:4174;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100k;
        proxy_read_timeout 120s;
    }
}
