# Bootstrap only. Do not proxy the login page until HTTPS is ready.
server {
    listen 80;
    server_name test.nexahub.airsales.ub.mn;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/nexahub-test-acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
